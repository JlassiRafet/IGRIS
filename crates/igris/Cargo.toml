[package]
name = "igris"
description = "Agent orchestration: a chat assistant hands coding work to agents in Herdr, a decision model picks, the shell verifies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["agents", "orchestration", "herdr", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "igris"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
igris-core = { version = "0.1.0-rc3", path = "../igris-core" }
igris-detect = { version = "0.1.0-rc3", path = "../igris-detect" }
ratatui = "=0.30.2"
serde_json = "=1.0.154"
unicode-width = "=0.2.3"

[target.'cfg(unix)'.dependencies]
signal-hook = "=0.3.18"
