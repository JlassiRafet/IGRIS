name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  rust:
    strategy:
      matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    # The commands below are bash on every platform (Git Bash on the Windows runner).
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: (rustup toolchain install 2>/dev/null || rustup show) && cargo --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The terminal app in a real (detached) terminal: keys, mouse, help, resize, quit. Linux only.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y tmux && cargo build && scripts/tui-e2e.sh
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      # The gitleaks action fails on a repository's first push (it scans from the first commit's
      # parent). Run the pinned, checksum-verified binary over the whole history instead.
      - name: gitleaks (full history)
        env: {V: "8.30.1", SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"}
        run: |
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks_${V}_linux_x64.tar.gz" | sha256sum -c -
          tar xzf "gitleaks_${V}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner .
