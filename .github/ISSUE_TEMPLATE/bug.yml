name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "What you did, what you expected, what you got."}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: "igris --version", placeholder: "igris 0.0.0"}
  - type: input
    id: os
    attributes: {label: Operating system, placeholder: "Ubuntu 24.04, macOS 15, ..."}
